name: shannian

services:
  shannian:
    build:
      context: .
    image: shannian:local
    container_name: shannian
    init: true
    # Match the owner of the bind-mounted data directory on NAS hosts.
    user: "${SHANNIAN_UID:-1000}:${SHANNIAN_GID:-1000}"
    ports:
      # Opt in to LAN/public exposure with SHANNIAN_BIND_ADDRESS=0.0.0.0.
      - "${SHANNIAN_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    environment:
      PORT: "8787"
      LISTEN_HOST: "0.0.0.0"
      DATA_DIR: /data
      WEB_DIST: /app/apps/web/dist
      # Loopback development uses HTTP. Set true whenever TLS terminates at a
      # reverse proxy (required before exposing SHANNIAN_BIND_ADDRESS publicly).
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      NODE_ENV: production
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-}"
      # The referenced path must also be mounted into the container by an override.
      SETTINGS_ENCRYPTION_KEY_FILE: "${SETTINGS_ENCRYPTION_KEY_FILE:-}"
      ENRICH_CONCURRENCY: "${ENRICH_CONCURRENCY:-2}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
      # Optional outbound proxy (settings can override it at runtime):
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
    volumes:
      # Preserve the existing ./data deployment by default. Override the source
      # only after an explicit backup/migration to another bind-mounted path.
      - "${SHANNIAN_DATA_SOURCE:-./data}:/data"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    mem_reservation: 256m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
