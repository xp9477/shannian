services:
  shannian:
    build: .
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/data
      - WEB_DIST=/app/apps/web/dist
      - COOKIE_SECURE=true
      - NODE_ENV=production
      # 可选：出站 HTTP 代理（设置页可覆盖）。例：http://host.docker.internal:7890
      # - HTTP_PROXY=http://127.0.0.1:7890
      # - HTTPS_PROXY=http://127.0.0.1:7890
    volumes:
      - shannian_data:/data
    restart: unless-stopped

volumes:
  shannian_data:
